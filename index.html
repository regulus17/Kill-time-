<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fuji Lawson Diorama</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; }
  #c { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
  #header { display: flex; justify-content: center; }
  .title-badge {
    background: rgba(255,255,255,0.18); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.35); border-radius: 30px;
    padding: 8px 20px; color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 2.5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25); white-space: nowrap;
  }
  #weather-bar { pointer-events: auto; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .wbtn {
    border: none; border-radius: 24px; padding: 10px 22px;
    font-size: 14px; font-weight: 700;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    cursor: pointer; letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .wbtn:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,0.22); }
  .wbtn:active { transform: translateY(0); }
  .wbtn.active { outline: 3px solid #fff; outline-offset: 2px; }
  #w-sunny  { background: #FFD93D; color: #7A4E00; }
  #w-cloudy { background: #90A4AE; color: #1A2E35; }
  #w-rainy  { background: #455A64; color: #E0F2F1; }
  #hint {
    pointer-events: none; text-align: center;
    color: rgba(255,255,255,0.75);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px; letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3); margin-top: 6px;
  }
  @media (max-width: 480px) {
    .title-badge { font-size: 11px; letter-spacing: 1.5px; padding: 7px 14px; }
    .wbtn { padding: 9px 16px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="header">
    <div class="title-badge">LAWSON × FUJI &nbsp;｜&nbsp; ローポリジオラマ</div>
  </div>
  <div>
    <div id="weather-bar">
      <button class="wbtn active" id="w-sunny"  onclick="setWeather('sunny')">☀️ 晴れ</button>
      <button class="wbtn"        id="w-cloudy" onclick="setWeather('cloudy')">☁️ 曇り</button>
      <button class="wbtn"        id="w-rainy"  onclick="setWeather('rainy')">🌧️ 雨</button>
    </div>
    <div id="hint">drag to rotate · scroll to zoom</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x87CEEB);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 22, 65);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(14, 9, 18);
camera.lookAt(0, 1.5, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI / 2.05;
controls.target.set(0, 1.5, 0);

// helpers
function mat(color, shininess = 15) {
  return new THREE.MeshPhongMaterial({ color, flatShading: true, shininess });
}
function box(w, h, d, color, shine = 15) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, shine));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function cyl(rt, rb, h, segs, color, shine = 15) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), mat(color, shine));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function sph(r, ws, hs, color) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), mat(color));
  m.castShadow = true; m.receiveShadow = true; return m;
}

// ─── SKY DOME ─────────────────────────────────────────────────────────────────
const skyDomeMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(200, 16, 12), skyDomeMat);
scene.add(skyDome);

// ─── DYNAMIC CLOUDS (always present, color/density changes per weather) ───────
const allCloudMats = [];

function buildCloudMesh(scale, color) {
  const g = new THREE.Group();
  const blobs = [
    [0,    0,    0,    1.00],
    [1.15, 0.20, 0.10, 0.85],
    [-1.05,0.15,-0.05, 0.82],
    [0.55, 0.55, 0.15, 0.72],
    [-0.50,0.48,-0.10, 0.68],
    [0.12, 0.82, 0.05, 0.58],
    [1.90, 0.02, 0,    0.60],
    [-1.80,0.08, 0,    0.56],
    [0.85,-0.10, 0.2,  0.55],
    [-0.85,-0.08,-0.2, 0.52],
  ];
  blobs.forEach(([bx,by,bz,s]) => {
    const m = new THREE.MeshPhongMaterial({ color, flatShading: true });
    allCloudMats.push(m);
    const blob = new THREE.Mesh(new THREE.SphereGeometry(s * scale, 5, 4), m);
    blob.position.set(bx * scale * 1.1, by * scale, bz * scale * 0.6);
    g.add(blob);
  });
  return g;
}

const cloudData = [
  { group: buildCloudMesh(1.7, 0xFFFFFF), speed: 0.00038, amp: 3.2, phase: 0.0,  baseX: -9,  y: 9.5,  z: -11 },
  { group: buildCloudMesh(1.4, 0xFFFFFF), speed: 0.00030, amp: 2.8, phase: 1.3,  baseX:  5,  y: 11.0, z: -13 },
  { group: buildCloudMesh(1.2, 0xFFFFFF), speed: 0.00048, amp: 2.0, phase: 2.5,  baseX: -2,  y: 10.5, z: -9  },
  { group: buildCloudMesh(1.5, 0xFFFFFF), speed: 0.00034, amp: 3.0, phase: 0.9,  baseX: 11,  y: 9.8,  z: -10 },
  { group: buildCloudMesh(1.1, 0xFFFFFF), speed: 0.00044, amp: 1.8, phase: 3.7,  baseX:-13,  y: 10.0, z: -7  },
  { group: buildCloudMesh(1.6, 0xFFFFFF), speed: 0.00036, amp: 3.5, phase: 1.7,  baseX:  3,  y: 9.0,  z: -15 },
  { group: buildCloudMesh(1.0, 0xFFFFFF), speed: 0.00042, amp: 2.2, phase: 4.1,  baseX:  8,  y: 11.5, z: -6  },
];
cloudData.forEach(d => {
  d.group.position.set(d.baseX, d.y, d.z);
  scene.add(d.group);
});

// ─── GROUND PLATFORM ──────────────────────────────────────────────────────────
const platform = cyl(13.5, 14, 0.7, 8, 0x8FAE7A);
platform.position.y = -0.35; scene.add(platform);

const platformRim = cyl(14.2, 14.5, 0.4, 8, 0x6D8A5E);
platformRim.position.y = -0.7; scene.add(platformRim);

const base = cyl(14.5, 14.5, 0.25, 8, 0x556B4A);
base.position.y = -0.92; scene.add(base);

const grass = cyl(13.2, 13.2, 0.12, 8, 0x9DC47A);
grass.position.y = 0.0; scene.add(grass);

// stone border
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const st = new THREE.Mesh(
    new THREE.BoxGeometry(0.5 + Math.random() * 0.3, 0.2, 0.4 + Math.random() * 0.2),
    mat([0xB0A090, 0xA09080, 0x9A8878][i % 3])
  );
  st.position.set(Math.cos(a) * 11.5, 0.1, Math.sin(a) * 11.5);
  st.rotation.y = a;
  scene.add(st);
}

// ─── ROAD ─────────────────────────────────────────────────────────────────────
const road = box(3.2, 0.08, 11, 0x555566);
road.position.set(-0.5, 0.06, 2); scene.add(road);
for (let z = -4; z <= 5; z += 1.5) {
  const dash = box(0.12, 0.09, 0.75, 0xEEEE88);
  dash.position.set(-0.5, 0.07, z); scene.add(dash);
}
const kerb1 = box(0.18, 0.14, 11, 0xCCBBAA); kerb1.position.set(1.5, 0.08, 2); scene.add(kerb1);
const kerb2 = box(0.18, 0.14, 11, 0xCCBBAA); kerb2.position.set(-2.5, 0.08, 2); scene.add(kerb2);
const sidewalk = box(2.0, 0.1, 11, 0xC8BA9A); sidewalk.position.set(3.0, 0.08, 2); scene.add(sidewalk);

// ─── MT. FUJI (realistic low-poly profile via LatheGeometry) ──────────────────
const fuji = new THREE.Group();

// Main body — wide base tapering S-curve profile
const fujiPts = [
  new THREE.Vector2(9.4, 0.0),
  new THREE.Vector2(8.6, 0.6),
  new THREE.Vector2(7.4, 1.6),
  new THREE.Vector2(6.2, 3.0),
  new THREE.Vector2(5.0, 4.4),
  new THREE.Vector2(3.8, 5.7),
  new THREE.Vector2(2.8, 7.0),
  new THREE.Vector2(1.8, 8.1),
  new THREE.Vector2(1.0, 9.0),
  new THREE.Vector2(0.42, 9.7),
  new THREE.Vector2(0.14, 10.2),
];
const fujiBodyGeo = new THREE.LatheGeometry(fujiPts, 10);
const fujiBody = new THREE.Mesh(fujiBodyGeo, mat(0x6E5E4E));
fujiBody.castShadow = true; fuji.add(fujiBody);

// Snow — LatheGeometry using the EXACT same profile points as the mountain body
// so the snow surface sits flush on the mountain, zero clipping.
// Starts at y=6.0 (snow line), covers summit.
const snowPts = [
  new THREE.Vector2(3.8, 5.7),   // snow line (matches body profile exactly)
  new THREE.Vector2(2.8, 7.0),
  new THREE.Vector2(1.8, 8.1),
  new THREE.Vector2(1.0, 9.0),
  new THREE.Vector2(0.42, 9.7),
  new THREE.Vector2(0.14, 10.2),
];
const snowMesh = new THREE.Mesh(new THREE.LatheGeometry(snowPts, 10), mat(0xF2F2F2));
snowMesh.castShadow = true;
// Tiny Y-offset so snow renders on top of body (no z-fighting)
snowMesh.position.y = 0.02;
fuji.add(snowMesh);

// Upper gray-rock zone — same trick, exact profile, slim offset
const upperPts = [
  new THREE.Vector2(5.0, 4.4),
  new THREE.Vector2(3.8, 5.7),
  new THREE.Vector2(2.8, 7.0),
];
const upperZoneMat = mat(0x5C5248);
upperZoneMat.polygonOffset = true;
upperZoneMat.polygonOffsetFactor = -1;
upperZoneMat.polygonOffsetUnits = -1;
const upperZone = new THREE.Mesh(new THREE.LatheGeometry(upperPts, 10), upperZoneMat);
upperZone.position.y = 0.01; fuji.add(upperZone);

// Crater ring
const crater = cyl(0.22, 0.18, 0.18, 8, 0x3A3028);
crater.position.y = 10.3; fuji.add(crater);

// Dark lava base spread
const lavaBase = new THREE.Mesh(
  new THREE.CylinderGeometry(9.0, 10.5, 1.2, 10),
  mat(0x4A3E34)
);
lavaBase.position.y = -0.6; fuji.add(lavaBase);

fuji.position.set(-5.0, 0, -9.5);
scene.add(fuji);

// Foothills
[[-3.5, -6.5, 0x6A7A5A], [-8, -5.5, 0x7A8A6A], [-1.5, -7.8, 0x5E6E4E], [-9.5, -7.2, 0x688060]].forEach(([x,z,c]) => {
  const h = sph(2.0, 5, 3, c);
  h.position.set(x, -0.3, z); h.scale.y = 0.45;
  scene.add(h);
});

// ─── LAWSON CONVENIENCE STORE ──────────────────────────────────────────────────
const lawson = new THREE.Group();

const bldg = box(4.2, 2.8, 3.2, 0xEDEDED); bldg.position.y = 1.4; lawson.add(bldg);
const roof = box(4.4, 0.22, 3.4, 0x1455A4); roof.position.y = 2.91; lawson.add(roof);
const overhang = box(5.0, 0.15, 4.0, 0x0D3E88); overhang.position.y = 2.65; lawson.add(overhang);
const stripe = box(4.22, 0.95, 0.06, 0x1A68BE); stripe.position.set(0, 0.98, 1.63); lawson.add(stripe);

// ── LAWSON SIGN (canvas texture) ──
const lc = document.createElement('canvas');
lc.width = 512; lc.height = 128;
const lx = lc.getContext('2d');
lx.fillStyle = '#0D3E88';
lx.fillRect(0, 0, 512, 128);
lx.fillStyle = '#FFFFFF';
lx.fillRect(6, 6, 500, 116);
lx.fillStyle = '#1A68BE';
lx.font = 'bold 80px Arial, Helvetica, sans-serif';
lx.textAlign = 'center';
lx.textBaseline = 'middle';
lx.fillText('LAWSON', 256, 68);
// blue accent strip bottom
lx.fillStyle = '#1A68BE';
lx.fillRect(6, 98, 500, 24);
// L badge on left
lx.fillStyle = '#0D3E88';
lx.fillRect(6, 6, 72, 92);
lx.fillStyle = '#FFFFFF';
lx.font = 'bold 68px Arial, Helvetica, sans-serif';
lx.textAlign = 'center';
lx.fillText('L', 42, 56);

const lawsonTex = new THREE.CanvasTexture(lc);
const signFaceMat = new THREE.MeshBasicMaterial({ map: lawsonTex });

// Sign box (3D lit frame)
const signFrame = box(3.0, 0.78, 0.16, 0x0D3E88);
signFrame.position.set(0, 2.38, 1.66); lawson.add(signFrame);

// Sign face (canvas texture)
const signFace = new THREE.Mesh(new THREE.PlaneGeometry(2.85, 0.65), signFaceMat);
signFace.position.set(0, 2.38, 1.755); lawson.add(signFace);

// Sign top light bar (glowing yellow)
const signLight = new THREE.Mesh(
  new THREE.BoxGeometry(3.0, 0.10, 0.18),
  new THREE.MeshPhongMaterial({ color: 0xFFF176, emissive: 0xFFEE58, emissiveIntensity: 0.8, flatShading: true })
);
signLight.position.set(0, 2.80, 1.66); lawson.add(signLight);

// Glass windows
const glassMat = new THREE.MeshPhongMaterial({ color: 0x9CD3E8, transparent: true, opacity: 0.55, flatShading: true, shininess: 60 });
[[-1.3,1.35,1.64],[0,1.35,1.64],[1.3,1.35,1.64]].forEach(([x,y,z]) => {
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.8, 0.06), glassMat);
  w.position.set(x,y,z); lawson.add(w);
});
const door = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.6, 0.06),
  new THREE.MeshPhongMaterial({ color: 0xB8DDEF, transparent: true, opacity: 0.45, flatShading: true, shininess: 80 }));
door.position.set(0, 0.8, 1.64); lawson.add(door);
[[-2.14,1.3,0],[-2.14,1.3,0.8]].forEach(([x,y,z]) => {
  const sw = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.65, 0.65), glassMat);
  sw.position.set(x,y,z); lawson.add(sw);
});

const ac = box(0.7, 0.3, 0.5, 0xCCCCCC); ac.position.set(1.5, 3.1, 0); lawson.add(ac);

const canopy = box(3.2, 0.12, 1.2, 0x1455A4); canopy.position.set(0, 2.62, 2.2); lawson.add(canopy);
for (let x = -1.2; x <= 1.2; x += 0.4) {
  const cs = box(0.12, 0.13, 1.2, 0xFFFFFF); cs.position.set(x, 2.62, 2.2); lawson.add(cs);
}

lawson.position.set(2.8, 0.1, -0.8);
scene.add(lawson);

// vending machines
[[0xD32F2F,4.9,-0.5],[0x1565C0,5.55,-0.5],[0x2E7D32,6.2,-0.5]].forEach(([c,x,z]) => {
  const vm = box(0.55, 1.35, 0.45, c); vm.position.set(x, 0.78, z); scene.add(vm);
  const scr = box(0.57, 0.28, 0.47, 0xCCEEFF); scr.position.set(x, 1.1, z); scene.add(scr);
});
[[4.9,0.35],[5.45,0.35]].forEach(([x,z]) => {
  const b = cyl(0.18, 0.2, 0.6, 6, 0x757575); b.position.set(x, 0.4, z); scene.add(b);
  const bl = cyl(0.22, 0.18, 0.1, 6, 0x424242); bl.position.set(x, 0.75, z); scene.add(bl);
});

// ─── PARKING LOT ──────────────────────────────────────────────────────────────
const parking = box(5.5, 0.08, 4.2, 0x8E8E9E); parking.position.set(2.8, 0.08, 4.3); scene.add(parking);
for (let i = 0; i < 4; i++) {
  const ln = box(0.07, 0.09, 4.1, 0xEEEEEE); ln.position.set(0.3 + i * 1.5, 0.09, 4.3); scene.add(ln);
}
const stopLine = box(5.4, 0.09, 0.1, 0xEEEEEE); stopLine.position.set(2.8, 0.09, 2.3); scene.add(stopLine);

// ─── MINIVAN ──────────────────────────────────────────────────────────────────
const van = new THREE.Group();
const chassis = box(1.65, 0.2, 3.6, 0x333344); chassis.position.y = 0.18; van.add(chassis);
const vanBody = box(1.6, 0.78, 3.5, 0xFF8F00); vanBody.position.y = 0.57; van.add(vanBody);
const cabin = box(1.5, 0.65, 2.6, 0xFFA000); cabin.position.set(0, 1.11, -0.2); van.add(cabin);
const hood = box(1.4, 0.3, 0.55, 0xFF8F00); hood.position.set(0, 0.86, 1.1); hood.rotation.x = 0.5; van.add(hood);
const wshield = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.45,0.06),
  new THREE.MeshPhongMaterial({color:0x9CBDCC,transparent:true,opacity:0.5,flatShading:true}));
wshield.position.set(0,1.16,1.12); wshield.rotation.x=0.55; van.add(wshield);
const vanGlass = new THREE.MeshPhongMaterial({color:0x9CBDCC,transparent:true,opacity:0.45,flatShading:true});
[-0.82,0.82].forEach(x => {
  const sw = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.45,1.8),vanGlass);
  sw.position.set(x,1.1,-0.05); van.add(sw);
});
const seam = box(1.62,0.78,0.06,0xDD7A00); seam.position.set(0,0.57,-1.72); van.add(seam);
function addVanWheel(x,z) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.22,9),mat(0x1A1A1A));
  t.rotation.z = Math.PI/2; t.position.set(x,0.28,z); van.add(t);
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.24,8),mat(0xBBBBBB));
  r.rotation.z = Math.PI/2; r.position.set(x,0.28,z); van.add(r);
}
[[0.92,1.1],[-0.92,1.1],[0.92,-1.1],[-0.92,-1.1]].forEach(([x,z]) => addVanWheel(x,z));
[[-0.55,0.52,1.4],[0.55,0.52,1.4]].forEach(([x,y,z]) => {
  const hl = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.18,0.06),mat(0xFFF9C4,60)); hl.position.set(x,y,z); van.add(hl);
});
van.position.set(2.5, 0.1, 4.5); van.rotation.y = Math.PI*0.05; scene.add(van);

// ─── RIVER ────────────────────────────────────────────────────────────────────
// Flat river plane — no vertex deformation, stays within its banks
const riverGeo = new THREE.PlaneGeometry(22, 2.0, 1, 1);

const riverMat = new THREE.MeshPhongMaterial({
  color: 0x4AADCA, transparent: true, opacity: 0.82, flatShading: true, shininess: 130
});
const riverMesh = new THREE.Mesh(riverGeo, riverMat);
riverMesh.rotation.x = -Math.PI / 2;
riverMesh.position.set(0, 0.07, -3.5);
scene.add(riverMesh);

// River bed (pebble gray visible under water)
const riverBed = box(22, 0.05, 2.0, 0x7A9A9A);
riverBed.position.set(0, 0.04, -3.5); scene.add(riverBed);

// River banks — raised earth edges
const bank1 = box(22, 0.28, 0.5, 0x9A8A6A);
bank1.position.set(0, 0.14, -2.55); scene.add(bank1);
const bank2 = box(22, 0.28, 0.5, 0x9A8A6A);
bank2.position.set(0, 0.14, -4.45); scene.add(bank2);

// Small river rocks
[[-3.5,0.12,-2.8],[1.2,0.12,-4.2],[-0.8,0.12,-3.1],[2.5,0.12,-3.9]].forEach(([x,y,z]) => {
  const rock = sph(0.18 + Math.random()*0.12, 5, 4, 0x8A9090);
  rock.scale.y = 0.6; rock.position.set(x,y,z); scene.add(rock);
});

// ─── SWANS ────────────────────────────────────────────────────────────────────
function makeSwan(px, pz, ry) {
  const g = new THREE.Group();

  const bodyM = new THREE.MeshPhongMaterial({ color: 0xFAFAFA, flatShading: true });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 8, 6), bodyM);
  body.scale.set(1.0, 0.70, 1.55); body.position.y = 0.32; body.castShadow = true; g.add(body);

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 6), bodyM);
  tail.rotation.x = Math.PI * 0.62; tail.position.set(0, 0.42, -0.55); g.add(tail);

  const neckM = new THREE.MeshPhongMaterial({ color: 0xF8F8F8, flatShading: true });
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.11, 0.62, 6), neckM);
  neck.position.set(0, 0.60, 0.36); neck.rotation.x = -0.58; g.add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.145, 7, 6), neckM);
  head.position.set(0, 0.98, 0.62); g.add(head);

  const beak = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.055, 0.20), mat(0xFF8C00));
  beak.position.set(0, 0.96, 0.78); g.add(beak);

}

// ─── CHERRY BLOSSOM TREES (improved, along river banks) ───────────────────────
const pinks = [0xFFB7C5, 0xFFC0CB, 0xFF96AF, 0xFFCCDA, 0xFFB0C8, 0xFFA8C0];
const rng = Math.random.bind(Math);

function makeTree(px, pz) {
  const g = new THREE.Group();
  const pc = () => pinks[Math.floor(rng() * pinks.length)];

  // Root flare — center at 0.12 so bottom is at -0.06 (roots sink into soil)
  const rf = cyl(0.28, 0.36, 0.36, 6, 0x5C3E10); rf.position.y = 0.12; g.add(rf);

  // Main trunk
  const trunk = cyl(0.10, 0.22, 2.3, 6, 0x7A5015); trunk.position.y = 1.25; g.add(trunk);

  // Trunk upper section with slight lean
  const trunk2 = cyl(0.07, 0.10, 1.1, 5, 0x7A5015);
  trunk2.position.set(0.04, 2.70, 0.02); trunk2.rotation.z = 0.07; g.add(trunk2);

  // 4 main branches radiating at different heights/angles
  const bDefs = [
    { p:[0.55,2.15, 0.12], r:[ 0.0, 0.1,-0.50], len:1.35 },
    { p:[-0.48,2.05, 0.06], r:[ 0.0, 1.0, 0.42], len:1.20 },
    { p:[0.12,2.25, 0.48], r:[-0.42, 0.5, 0.10], len:1.10 },
    { p:[-0.10,2.35,-0.40], r:[ 0.38,-0.5, 0.00], len:1.05 },
  ];
  bDefs.forEach(b => {
    const br = cyl(0.04, 0.09, b.len, 4, 0x8B6020);
    br.position.set(...b.p); br.rotation.set(...b.r); g.add(br);
    // sub-branch
    const sbr = cyl(0.025, 0.04, 0.65, 4, 0x8B6020);
    sbr.position.set(b.p[0]+b.r[2]*0.6, b.p[1]+0.5, b.p[2]-b.r[0]*0.5);
    sbr.rotation.set(b.r[0]-0.2, b.r[1]+0.5, b.r[2]-0.15); g.add(sbr);
    // tip sub-branch
    const tbr = cyl(0.018, 0.025, 0.4, 4, 0x8B6020);
    tbr.position.set(b.p[0]+b.r[2]*1.0, b.p[1]+0.85, b.p[2]-b.r[0]*0.9);
    tbr.rotation.set(b.r[0]-0.35, b.r[1]+0.9, b.r[2]-0.28); g.add(tbr);
  });

  // Dense blossom canopy — 14 overlapping spheres at varied positions/sizes
  const blosDefs = [
    [0.00, 3.00, 0.00, 0.60], [0.70, 2.65, 0.28, 0.54], [-0.65, 2.60,-0.18, 0.52],
    [0.28, 2.42,-0.58, 0.50], [-0.35, 2.48, 0.54, 0.48], [0.12, 3.30, 0.12, 0.52],
    [0.55, 2.90,-0.42, 0.46], [-0.52, 2.95, 0.38, 0.48], [0.72, 2.48,-0.12, 0.42],
    [-0.68, 2.38, 0.22, 0.40], [0.18, 2.68, 0.64, 0.44], [-0.22, 2.72,-0.58, 0.46],
    [0.02, 2.22, 0.08, 0.36], [-0.38, 3.10,-0.28, 0.40],
  ];
  blosDefs.forEach(([bx,by,bz,sz]) => {
    const bl = sph(sz + rng()*0.08, 6, 4, pc());
    bl.position.set(bx+(rng()-0.5)*0.1, by+(rng()-0.5)*0.1, bz+(rng()-0.5)*0.1);
    g.add(bl);
  });

  // Drooping blossom clusters (hanging lower)
  [[-0.45,1.92, 0.38],[0.52,1.90,-0.32],[0.10,2.02,-0.52]].forEach(([bx,by,bz]) => {
    const hc = sph(0.28+rng()*0.08, 5, 4, pc());
    hc.position.set(bx, by, bz); g.add(hc);
  });

  g.position.set(px, 0.0, pz);
  return g;
}

}

const rainGeom = new THREE.BufferGeometry();

}
const petalGeom = new THREE.BufferGeometry();

// ─── WEATHER SYSTEM ───────────────────────────────────────────────────────────
const W = {
  sunny: {
    sky:0x87CEEB, fogColor:0x87CEEB, fogNear:22, fogFar:65,
    ambInt:0.55, ambColor:0xFFFFFF, sunInt:1.3, sunColor:0xFFF8E7,
    cloudColor:0xFFFFFF, cloudOpacity:1.0,
    rain:false, puddles:false, petalAlpha:1.0,
  },
  cloudy: {
    sky:0xA0AABA, fogColor:0xA0AABA, fogNear:14, fogFar:42,
    ambInt:0.75, ambColor:0xCCCCDD, sunInt:0.45, sunColor:0xD8D8E8,
    cloudColor:0xC8C8D0, cloudOpacity:1.0,
    rain:false, puddles:false, petalAlpha:0.55,
  },
  rainy: {
    sky:0x4A5F6A, fogColor:0x4E6070, fogNear:8, fogFar:30,
    ambInt:0.45, ambColor:0xAABBCC, sunInt:0.15, sunColor:0xB0C0CC,
    cloudColor:0x7A8A90, cloudOpacity:1.0,
    rain:true, puddles:true, petalAlpha:0.15,
  }
};

function setWeather(name) {
  const s = W[name];
  renderer.setClearColor(s.sky);
  skyDomeMat.color.setHex(s.sky);
  scene.fog.color.setHex(s.fogColor);
  scene.fog.near = s.fogNear;
  scene.fog.far  = s.fogFar;
  ambLight.intensity = s.ambInt;
  ambLight.color.setHex(s.ambColor);
  sunLight.intensity = s.sunInt;
  sunLight.color.setHex(s.sunColor);
  // update all cloud materials
  allCloudMats.forEach(m => m.color.setHex(s.cloudColor));
  rainPoints.visible = s.rain;
  puddle1.visible = s.puddles;
  puddle2.visible = s.puddles;
  petalMat.opacity = s.petalAlpha;
  petals.visible = s.petalAlpha > 0.05;
  document.querySelectorAll('.wbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('w-' + name).classList.add('active');
}

setWeather('sunny');

// ─── ANIMATION LOOP ───────────────────────────────────────────────────────────
let tick = 0;

function animate() {
  requestAnimationFrame(animate);
  tick++;
  controls.update();

  // Clouds always drift
  cloudData.forEach(d => {
    d.group.position.x = d.baseX + Math.sin(tick * d.speed + d.phase) * d.amp;
    d.group.position.y = d.y + Math.sin(tick * d.speed * 1.3 + d.phase) * 0.15;
  });

  // Petals
  const pp = petals.geometry.attributes.position.array;
  for (let i = 0; i < N_PETALS; i++) {
    const v = petalVel[i];
    v.sw += v.spd;
    pp[i*3]   += v.vx + Math.sin(v.sw)*0.005;
    pp[i*3+1] += v.vy;
    pp[i*3+2] += v.vz + Math.cos(v.sw)*0.004;
    if (pp[i*3+1] < 0) {
      pp[i*3]   = (Math.random()-0.5)*26;
      pp[i*3+1] = 8.5;
      pp[i*3+2] = (Math.random()-0.5)*26;
    }
  }
  petals.geometry.attributes.position.needsUpdate = true;

  // Rain
  if (rainPoints.visible) {
    const rp = rainPoints.geometry.attributes.position.array;
    for (let i = 0; i < N_RAIN; i++) {
      rp[i*3+1] += rainVel[i];
      rp[i*3]   += 0.025;
      if (rp[i*3+1] < 0) {
        rp[i*3]  = (Math.random()-0.5)*32;
        rp[i*3+1]= 14;
        rp[i*3+2]= (Math.random()-0.5)*32;
      }
    }
    rainPoints.geometry.attributes.position.needsUpdate = true;
  }

  // River ripple (subtle opacity pulse + surface shimmer via material)
  riverMat.opacity = 0.80 + Math.sin(tick * 0.04) * 0.04;

  // Swans gently bob
  scene.children.forEach(c => {
    if (c._isSwan) c.position.y = 0.03 + Math.sin(tick * 0.03 + c._swanPhase) * 0.025;
  });

  renderer.render(scene, camera);
}


animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
